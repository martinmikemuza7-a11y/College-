    <script>
      // Gracefully silence harmless Vite dev-server HMR WebSocket closures in AI Studio preview iframe
      window.addEventListener('error', function(event) {
        if (
          event &&
          event.message &&
          (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('[vite]') !== -1)
        ) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (String(event.reason).indexOf('WebSocket') !== -1 || String(event.reason).indexOf('[vite]') !== -1)
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
