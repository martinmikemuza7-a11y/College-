name: Study Buddy AI CI

on:
  push:
    branches:
      - main
      - fix/quiz-question-count-deduplication
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run regression tests
        run: bun run test
      - name: Type-check
        run: bun run lint
      - name: Build production frontend
        run: bun run build
